<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Düz Okey VIP - Pro Edition</title>
<link rel="stylesheet" href="style.css">

<script src="/socket.io/socket.io.js"></script></head>
<body>

<div class="online-overlay" id="online-lobby">
<div class="online-card">
<div class="online-title">DÜZ OKEY VIP</div>
<div class="online-subtitle">Arkadaşlarınla aynı masada oyna</div>
<div class="online-tabs">
<button class="online-tab active" id="createTab">ODA KUR</button>
<button class="online-tab" id="joinTab">ODAYA KATIL</button>
</div>
<div class="online-panel" id="createPanel">
<label>Adın</label><input autocomplete="off" id="nameCreate" maxlength="20" placeholder="Oyuncu"/>
<button class="online-btn primary" id="createRoom">YENİ ODA AÇ</button>
<button class="online-btn secondary" id="quickPlay">HIZLI OYUN (BOTLAR)</button>
</div>
<div class="online-panel" hidden="" id="joinPanel">
<label>Adın</label><input autocomplete="off" id="nameJoin" maxlength="20" placeholder="Oyuncu"/>
<label>Oda Kodu</label><input autocomplete="off" id="roomCode" maxlength="5" placeholder="K7X2M"/>
<button class="online-btn primary" id="joinRoom">ODAYA KATIL</button>
</div>
<div class="online-error" id="onlineError"></div>
</div>
</div>
<div class="online-overlay" hidden="" id="waiting-overlay">
<div class="online-card waiting-card">
<div class="online-title">ODA <span id="waitingCode"></span></div>
<div class="online-subtitle">4 koltuk dolunca oyun başlar</div>
<div class="seat-grid-vip" id="seatGrid"></div>
<div class="waiting-players" id="waitingPlayers"></div>
<div class="waiting-actions">
<button class="online-btn secondary" id="spectatorBtn">İZLEYİCİ OL</button>
<button class="online-btn primary" hidden="" id="startGame">OYUNU BAŞLAT</button>
</div>
</div>
</div>
<header class="top-navbar">
<div class="brand-logo">
<span class="tile-icon"></span>
            DÜZ OKEY VIP
        </div>
<div class="status-pill">
<span class="status-dot"></span>
<span id="status-text">Oyun yükleniyor...</span>
</div>
<button class="header-btn" onclick="toggleSound()">
<span id="sound-icon">🔊</span> <span id="sound-text">Ses: AÇIK</span>
</button>
</header>
<div class="ad-slot ad-top" aria-label="Reklam alanı"><span>REKLAM</span></div>
<div class="ad-slot ad-left" aria-label="Reklam alanı"><span>REKLAM</span></div>
<div class="ad-slot ad-right" aria-label="Reklam alanı"><span>REKLAM</span></div>
<div class="ad-slot ad-bottom" aria-label="Reklam alanı"><span>REKLAM</span></div>
<main id="game-board">
<div class="player-badge" id="seat-top">
<div class="player-avatar">👩</div>
<div class="player-info">
<div class="player-name" id="name-top">Gamze</div>
<div class="player-score" id="score-top">PUAN: 21</div>
<div class="timer-bar"><div class="timer-fill" id="timer-top"></div></div>
</div>
</div>
<div class="player-badge" id="seat-left">
<div class="player-avatar">👨‍✈️</div>
<div class="player-info">
<div class="player-name" id="name-left">Deniz</div>
<div class="player-score" id="score-left">PUAN: 21</div>
<div class="timer-bar"><div class="timer-fill" id="timer-left"></div></div>
</div>
</div>
<div class="player-badge" id="seat-bottom">
<div class="player-avatar">👩‍🦰</div>
<div class="player-info">
<div class="player-name" id="name-player">Alya (Siz)</div>
<div class="player-score" id="score-player">PUAN: 21</div>
<div class="timer-bar"><div class="timer-fill" id="timer-player"></div></div>
</div>
</div>
<div class="player-badge" id="seat-right">
<div class="player-avatar">👨</div>
<div class="player-info">
<div class="player-name" id="name-right">Kemal</div>
<div class="player-score" id="score-right">PUAN: 21</div>
<div class="timer-bar"><div class="timer-fill" id="timer-right"></div></div>
</div>
</div>
<div class="discard-spot" id="discard-top-spot"></div>
<div class="discard-spot" id="discard-left-spot" onclick="drawFromLeftDiscard()"></div>
<div class="discard-spot" id="discard-player-spot"></div>
<div class="discard-spot" id="discard-right-spot"></div>
<div id="center-area">
<div class="center-card-group">
<div class="tile tile-back" draggable="true" id="deck-tile" onclick="drawFromDeck()">
<span id="deck-count">45</span>
</div>
<span class="center-card-label">DESTE</span>
</div>
<div class="center-card-group">
<div id="gosterge-holder"></div>
<span class="center-card-label">GÖSTERGE</span>
</div>
<div class="center-card-group" id="finish-drop-zone" onclick="finishGame()">
<div id="okey-holder"></div>
<span class="center-card-label" style="color: #ef4444;">🎯 BİTİŞ / OKEY AT</span>
</div>
</div>
</main>
<div id="rack-container">
<div class="rack-row" id="rack-row-1"></div>
<div class="rack-row" id="rack-row-2"></div>
</div>
<footer class="action-bar">
<button class="btn-action" onclick="sortSeri()">⚡ Diz (Akıllı Dizilim)</button>
<button class="btn-action" onclick="sortByColor()">🎨 Renge Göre</button>
<button class="btn-action" onclick="sortByNumber()">🔢 Sayıya Göre</button>
<button class="btn-action" onclick="discardSelectedTile()">🎯 Seçili Taşı At</button>
<button class="btn-action btn-finish" onclick="finishGame()">🏆 OKEY AT / BİTİR</button>
</footer>
<div class="modal-overlay" id="game-modal">
<div class="modal-card">
<div class="modal-title" id="modal-title">🏆 OYUN BİTTİ</div>
<div class="modal-body" id="modal-body">Tebrikler, kazandınız!</div>
<button class="btn-modal" onclick="newRound()">YENİ EL BAŞLAT</button>
</div>
</div>

<script src="/client.js"></script></body>
</html>
